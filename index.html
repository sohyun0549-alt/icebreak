<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICEBREAK.EXE — 동아리 질문 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:          #f0f6fc;   /* changed: pale-blue page bg from chip */
    --mac-blue:       #c4e0fa;   /* light blue from chip */
    --mac-blue-lt:    #eaf4fb;   /* pale blue from chip */
    --mac-blue-md:    #a8d2fe;   /* sky blue from chip */
    --mac-blue-dk:    #82c5fe;   /* brightest sky from chip */
    --mac-blue-ink:   #2e6bad;   /* derived deeper blue for text/borders */
    --screen:         #162133;
    --screen-deep:    #0c131f;
    --phosphor:       #b8e8ff;
    --amber:          #ffdd99;
    --yellow:         #ffd93d;
    --red:            #ff6b6b;
    --red-dk:         #c94949;
    --red-shadow:     #7f2727;
    --green:          #7bd389;
    --ink:            #1d3556;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: 'Jua', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(168,210,254,0.35), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(130,197,254,0.30), transparent 50%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px 60px;
    overflow-x: hidden;
  }

  

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
    max-width: 520px;
  }

  /* ---------- Header ---------- */
  .header { text-align: center; }
  .header img.title-logo {
    width: 100%;
    max-width: 510px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(3px 4px 0 rgba(109,142,169,0.25));
  }

  /* ---------- Digital Timer ---------- */
  .timer-wrap {
    background: #0f1420;
    border-radius: 14px;
    padding: 10px 20px 10px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,0.7),
      0 5px 0 #070a12,
      0 10px 18px rgba(0,0,0,0.2);
    position: relative;
    border: 2px solid #1d2636;
  }
  .timer-wrap::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 14px;
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green), 0 0 14px rgba(123,211,137,0.6);
    animation: led 1.4s ease-in-out infinite;
  }
  @keyframes led {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .timer-label {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--amber);
    letter-spacing: 3px;
    opacity: 0.85;
  }
  .timer-display {
    font-family: 'VT323', monospace;
    font-size: 46px;
    line-height: 1;
    color: var(--yellow);
    letter-spacing: 5px;
    text-shadow:
      0 0 8px var(--yellow),
      0 0 18px rgba(255,217,61,0.35);
    min-width: 88px;
    text-align: center;
  }
  .timer-display.warning {
    color: var(--red);
    text-shadow: 0 0 10px var(--red), 0 0 20px rgba(255,107,107,0.45);
    animation: blink 0.5s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ---------- iPod Player ---------- */
  .ipod-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    padding-right: 30px;   /* room for chain charm */
    padding-top: 10px;
  }

  .ipod {
    position: relative;
    width: 100%;
    background:
      linear-gradient(155deg, #ffffff 0%, #eaf4fb 45%, #c4e0fa 100%);
    border-radius: 28px;
    padding: 24px 22px 30px;
    overflow: hidden;
    box-shadow:
      inset 3px 3px 0 rgba(255,255,255,0.95),
      inset -2px -2px 0 rgba(130,197,254,0.35),
      0 6px 0 #a8d2fe,
      0 14px 28px rgba(46,107,173,0.28);
  }
  /* glossy top highlight */
  .ipod::before {
    content: '';
    position: absolute;
    top: 6px; left: 8px; right: 8px;
    height: 38%;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), transparent 70%);
    border-radius: 22px 22px 60% 60%;
    pointer-events: none;
    z-index: 2;
  }

  /* dark bezel surrounding the screen */
  .ipod-screen-frame {
    position: relative;
    z-index: 3;
    background: linear-gradient(135deg, #2a3a52, #1a2638);
    border-radius: 6px;
    padding: 4px;
    box-shadow:
      inset 0 0 5px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.4);
  }

  .ipod-screen {
    background: #ffffff;
    border-radius: 3px;
    height: 360px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* "Now Playing" title bar */
  .titlebar {
    background:
      linear-gradient(180deg, #7aa6d4 0%, #5687c0 50%, #3d6ea9 100%);
    color: #fff;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,0,0,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    flex-shrink: 0;
  }
  .titlebar .left {
    display: flex; align-items: center; gap: 6px;
  }
  .titlebar .play {
    color: #fff;
    font-size: 9px;
    line-height: 1;
    text-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .titlebar .now-playing {
    font-family: 'Jua', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .battery {
    width: 18px; height: 9px;
    background: linear-gradient(180deg, #8be096, #5cae6a);
    border: 1px solid rgba(0,0,0,0.45);
    border-radius: 1px;
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -3px; top: 2px;
    width: 2px; height: 4px;
    background: rgba(0,0,0,0.55);
    border-radius: 0 1px 1px 0;
  }

  /* roulette area between titlebar and progress bar */
  .roulette-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #ffffff;
  }

  /* Progress bar at bottom of screen */
  .progress {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px 6px;
    font-family: 'VT323', monospace;
    font-size: 11px;
    color: #5a6a7a;
    flex-shrink: 0;
    border-top: 1px solid #e8eef4;
  }
  .progress-bar {
    flex: 1;
    height: 5px;
    background: #dfe5ec;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #b8c3cf;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.1);
  }
  .progress-bar > div {
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg, #6a9bd4, #3d6ea9);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }

  /* selection band (subtle on white screen) */
  .selection-indicator {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 60px;
    background: rgba(106,155,212,0.10);
    border-top: 1px solid rgba(106,155,212,0.35);
    border-bottom: 1px solid rgba(106,155,212,0.35);
    pointer-events: none;
    z-index: 1;
  }

  /* roulette list (now on white iPod LCD) */
  .roulette {
    position: absolute;
    inset: 0;
    z-index: 2;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%);
    opacity: 1;
    transition: opacity 0.35s ease;
  }
  .roulette.hidden { opacity: 0; }
  .roulette-list {
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    transform: translateY(-30px);
    will-change: transform;
  }
  .roulette-item {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #6a7a8a;
    font-family: 'Gaegu', 'Jua', sans-serif;
    font-size: 15px;
    line-height: 1.3;
    padding: 0 16px;
    opacity: 0.5;
    transition: color 0.35s ease, opacity 0.35s ease, font-weight 0.35s ease;
  }
  .roulette-item.selected {
    opacity: 1;
    color: #1d3556;
    font-weight: 700;
  }

  /* idle screen */
  .idle-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: opacity 0.4s ease;
    pointer-events: none;
    gap: 4px;
    background: #fff;
  }
  .idle-text.hidden { opacity: 0; }
  .idle-text .line1 {
    font-family: 'VT323', monospace;
    font-size: 26px;
    letter-spacing: 3px;
    color: #3d6ea9;
  }
  .idle-text .line2 {
    font-family: 'Gaegu', sans-serif;
    font-size: 13px;
    color: #6a7a8a;
  }
  .cursor { display: inline-block; animation: caret 0.9s steps(2, end) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  /* Chain + spike charm */
  .chain {
    position: absolute;
    top: -8px;
    right: -6px;
    width: 70px;
    height: 130px;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(2px 3px 4px rgba(62,90,119,0.35));
  }

  /* ---------- Spin button (deep blue) ---------- */
  .spin-button {
    margin-top: 22px;
    background: linear-gradient(180deg, #5fa8e8 0%, #3576c7 55%, #1d4f8f 100%);
    color: #fff;
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    padding: 15px 54px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.45),
      inset -2px -3px 0 rgba(0,0,0,0.18),
      0 6px 0 #0d3060,
      0 10px 18px rgba(13,48,96,0.28);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .spin-button::before {
    content: '';
    position: absolute;
    top: 5px; left: 16px; right: 16px;
    height: 7px;
    background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
    border-radius: 999px;
    pointer-events: none;
  }
  .spin-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.45),
      inset -2px -3px 0 rgba(0,0,0,0.18),
      0 8px 0 #0d3060,
      0 12px 22px rgba(13,48,96,0.32);
  }
  .spin-button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.45),
      inset -2px -3px 0 rgba(0,0,0,0.18),
      0 2px 0 #0d3060;
  }
  .spin-button:disabled {
    cursor: not-allowed;
    background: linear-gradient(180deg, #b8c8d8, #8094aa);
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.25),
      0 4px 0 #5a6e84,
      0 8px 14px rgba(0,0,0,0.12);
  }

  .footer {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .footer img.brand-logo {
    width: 72px;
    height: auto;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }
  .footer img.brand-logo:hover { opacity: 1; }

  /* ---------- Responsive ---------- */
  @media (max-width: 520px) {
    body { padding: 18px 12px 40px; }
    .header img.title-logo { max-width: 100%; }
    .timer-display { font-size: 38px; min-width: 74px; }
    .timer-label { font-size: 16px; }
    .ipod { padding: 20px 18px 24px; border-radius: 24px; }
    .ipod-screen { height: 320px; }
    .roulette-item { font-size: 14px; padding: 0 12px; }
    .spin-button { font-size: 19px; padding: 13px 42px; letter-spacing: 3px; }
    .footer img.brand-logo { width: 64px; }
  }
  @media (max-width: 380px) {
    .ipod-screen { height: 290px; }
    .roulette-item { font-size: 13px; }
    .idle-text .line1 { font-size: 22px; }
  }
</style>
</head>

<script>
  const questions = [
    "오늘 플래쉬 오는 길에 어떤 노래 들었어?",
    "요즘 유튜브나 인스타 알고리즘에 제일 많이 뜨는 영상이 뭐야?",
    "주말에 아무 일정이 없다면, 밖으로 나가는 편? 집에서 충전하는 편?",
    "최근에 가본 공간(카페, 식당 등) 중에 제일 인상 깊었던 곳은?",
    "최근에 산 물건 중에 '이건 진짜 잘 샀다!' 하는 나만의 꿀템이 있다면?",
    "요즘 대화할 때 가장 자주 쓰는 밈이나 이모티콘은?",
    "스트레스받을 때 엽떡처럼 매운 거 먹기 vs 달달한 디저트 먹기",
    "내 흑역사 인스타 스토리에 24시간 박제 vs 릴스로 만들어서 알고리즘 태우기",
    "솔직히 첫인상이랑 지금 성격이 제일 180도 다른 사람은?"
  ];

  const ITEM_HEIGHT = 60;
  const REPEATS     = 10;   // duplicate the list for smooth infinite-feel scroll
  const SPIN_MS     = 5400;

  const rouletteList = document.getElementById('rouletteList');
  const roulette     = document.getElementById('roulette');
  const spinBtn      = document.getElementById('spinBtn');
  const timerEl      = document.getElementById('timer');
  const idleText     = document.getElementById('idleText');

  let isSpinning  = false;
  let countdownId = null;

  /* Build the duplicated list */
  (function build() {
    const frag = document.createDocumentFragment();
    for (let r = 0; r < REPEATS; r++) {
      questions.forEach((q) => {
        const el = document.createElement('div');
        el.className = 'roulette-item';
        el.textContent = q;
        frag.appendChild(el);
      });
    }
    rouletteList.appendChild(frag);
  })();

  /* Position helpers
     The list is anchored at top:50%. translateY(-30px) puts item #0 centered.
     For globalIndex N: translateY = -(N * ITEM_HEIGHT + ITEM_HEIGHT/2) centers item N. */
  function setTransform(y, animated) {
    rouletteList.style.transition = animated
      ? 'transform ' + SPIN_MS + 'ms cubic-bezier(0.12, 0.85, 0.18, 1)'
      : 'none';
    rouletteList.style.transform = 'translateY(' + y + 'px)';
  }

  // initial resting position (item 0 centered)
  setTransform(-ITEM_HEIGHT / 2, false);

  function clearSelected() {
    const prev = rouletteList.querySelector('.roulette-item.selected');
    if (prev) prev.classList.remove('selected');
  }

  function spin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled    = true;
    spinBtn.textContent = 'SPINNING...';

    idleText.classList.add('hidden');
    roulette.classList.remove('hidden');
    clearSelected();
    stopCountdown();
    timerEl.textContent = '--';
    timerEl.classList.remove('warning');

    // snap back to start (no animation), then kick off the long ease-out
    setTransform(-ITEM_HEIGHT / 2, false);
    // force reflow so the next transform animates
    void rouletteList.offsetHeight;

    const targetIdx    = Math.floor(Math.random() * questions.length);
    // Land somewhere deep in the duplicated list (cycle 7 of 10)
    const targetGlobal = questions.length * 7 + targetIdx;
    const finalY       = -(targetGlobal * ITEM_HEIGHT + ITEM_HEIGHT / 2);

    requestAnimationFrame(() => setTransform(finalY, true));

    setTimeout(() => {
      const items = rouletteList.children;
      if (items[targetGlobal]) items[targetGlobal].classList.add('selected');
      isSpinning = false;
      spinBtn.disabled    = false;
      spinBtn.textContent = 'SPIN !';
      startCountdown(20);
    }, SPIN_MS + 80);
  }

  function startCountdown(seconds) {
    stopCountdown();
    let remaining = seconds;
    timerEl.textContent = String(remaining).padStart(2, '0');
    timerEl.classList.remove('warning');

    countdownId = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        timerEl.textContent = '00';
        timerEl.classList.add('warning');
        stopCountdown();
        return;
      }
      timerEl.textContent = String(remaining).padStart(2, '0');
      if (remaining <= 5) timerEl.classList.add('warning');
    }, 1000);
  }

  function stopCountdown() {
    if (countdownId) { clearInterval(countdownId); countdownId = null; }
  }

  spinBtn.addEventListener('click', spin);
</script>
